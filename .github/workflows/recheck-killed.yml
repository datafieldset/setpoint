name: Recheck killed signals

# Monthly. Replays every retired signal combo on fresh BTC history using
# the live rules and opens a GitHub issue if any looks alive again. It
# never changes code. Un-killing stays a deliberate call.

on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Replay killed combos on BTC
        run: node scripts/recheck-killed.mjs --out report.md
      - name: Open an issue if anything looks alive
        if: ${{ hashFiles('recheck-candidates.flag') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat recheck-candidates.flag)" = "yes" ]; then
            gh issue create --title "Killed signal worth a second look ($(date +%Y-%m-%d))" --body-file report.md
          fi
