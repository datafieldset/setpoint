name: Signals cron

# Runs on GitHub's own servers, completely independent of any browser
# being open anywhere. This is the real fix for push notifications that
# used to only ever trigger from inside a customer's own, actively-open
# dashboard tab, exactly the case that fails on a phone the moment the
# OS suspends a background tab.
#
# Real, direct finding (Sep 6): GitHub's own scheduler is honestly
# unreliable at high frequency. A schedule declared for every 5 minutes
# was actually landing every 3-4 real hours in practice, confirmed
# directly from this repo's own run history. The unreliable part is
# specifically the scheduler deciding when to START a new job, not how
# long an already-running job can keep going once it does start (a
# single job can run up to 6 real hours, completely free on this public
# repo). So this asks GitHub to trigger a new run only every 5 hours,
# something it handles far more reliably, and once a run actually
# starts, it loops internally for hours, checking every real 5 minutes
# the whole time, never depending on the high-frequency scheduler at
# all.
#
# Real, second fix, same day (Sep 28): this used to be two entirely
# separate workflows, check-signals-cron and close-alert-cron, each
# independently triggering every 2 hours with a ~5.5-hour internal run.
# Since 5.5 hours comfortably outlives a 2-hour trigger gap, up to 3
# real, overlapping copies of EACH workflow could be alive
# simultaneously, meaning the database was getting hit by both
# together roughly once a minute, continuously, 24/7 — confirmed
# directly from Neon's own usage numbers (110 CU-hours used in under
# a month on the free tier, working out to the compute being actively
# awake roughly two-thirds of every single day). Neon's serverless
# compute only saves real money by scaling to zero when genuinely
# idle; hitting it this often never gave it the chance. Combined into
# one workflow, checking both endpoints back-to-back each real cycle,
# and stretched the trigger interval to roughly match how long a run
# actually lasts (5 hours vs. 5.5-hour runs, a small, honest overlap
# for safety instead of nearly triple redundancy) — this alone should
# cut the real, active-compute time dramatically without changing how
# often signals actually get checked in any way that matters.

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch: {}

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # a real, explicit safety net just under the hard, 360-minute (6h) platform limit
    steps:
      - name: Repeatedly check signals and close alerts for a real, long stretch
        run: |
          # Real, internal time budget, 330 real minutes (5.5 hours),
          # deliberately short of the hard, 6-hour platform limit so
          # this exits cleanly on its own rather than getting forcibly
          # killed mid-request.
          END=$(( $(date +%s) + 330*60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            curl -sS -f "https://setpointalerts.com/api/cron/check-signals?key=verified2026" \
              -o check.json \
              -w "\ncheck-signals HTTP status: %{http_code}\n" \
              --max-time 55 || echo "a single, real check-signals call failed, continuing the real, ongoing loop rather than exiting"
            cat check.json 2>/dev/null || true
            curl -sS -f "https://setpointalerts.com/api/close-alert?key=verified2026" \
              -o close.json \
              -w "\nclose-alert HTTP status: %{http_code}\n" \
              --max-time 55 || echo "a single, real close-alert call failed, continuing the real, ongoing loop rather than exiting"
            cat close.json 2>/dev/null || true
            sleep 300
          done
